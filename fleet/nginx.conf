events {
    worker_connections 8192;
}

http {
    access_log off;

    # Round robin across the fleet, as an ingress does across pods. Host must be forwarded unchanged:
    # the tenant is resolved from it, and nginx would otherwise send the upstream's own name.
    upstream fleet {
        server api1:7500 max_fails=0;
        server api2:7500 max_fails=0;
        server api3:7500 max_fails=0;
        server api4:7500 max_fails=0;
        server api5:7500 max_fails=0;
        keepalive 512;
    }

    server {
        listen 7600;

        location / {
            proxy_pass http://fleet;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
