{{- if .Values.ingress.enabled }}
{{- /*
Prefix paths only: every controller (ALB, nginx, Traefik) matches them the same way, while
ImplementationSpecific means an exact match on the AWS Load Balancer Controller.
*/}}
{{- $apiService := printf "%s-api-service" (include "enterprise-stack.fullname" .) }}
{{- $uiService := printf "%s-ui-service" (include "enterprise-stack.fullname" .) }}
{{- $apiPaths := list "/auth/" "/v1/" "/v2/" "/.well-known/" "/swagger" "/api.json" "/livez" "/features/" }}
{{- if .Values.ingress.exposeDebugEndpoints }}
{{- $apiPaths = append $apiPaths "/debug/" }}
{{- end }}
{{- $hosts := list .Values.ingress.host }}
{{- if .Values.ingress.wildcardHost }}
{{- $hosts = append $hosts (printf "*.%s" .Values.ingress.host) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enterprise-stack.fullname" . }}-ingress
  labels:
  {{- include "enterprise-stack.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.clusterIssuer }}
  annotations:
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
  {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range $hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      {{- range $apiPaths }}
      - path: {{ . }}
        pathType: Prefix
        backend:
          service:
            name: {{ $apiService | quote }}
            port:
              name: http
      {{- end }}
      {{- if $.Values.web.enabled }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $uiService | quote }}
            port:
              name: http
      {{- end }}
  {{- end }}
{{- end }}
