{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "enterprise-stack.serviceAccountName" . }}
  labels:
    {{- include "enterprise-stack.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API does not call the Kubernetes API. IRSA projects its own web identity token regardless.
automountServiceAccountToken: false
{{- end }}
