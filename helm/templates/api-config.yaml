apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enterprise-stack.fullname" . }}-api-config
  labels:
  {{- include "enterprise-stack.labels" . | nindent 4 }}
data:
  _features.conf: {{ .Values.featConf | toYaml | indent 1 }}
  auth.conf: {{ .Values.authConf | toYaml | indent 1 }}
  database.conf: {{ .Values.dbConf | toYaml | indent 1 }}
  superadmin-registration.conf: {{ .Values.superadminRegConf | toYaml | indent 1 }}
  enterprise.conf: {{ .Values.enterpriseConf | toYaml | indent 1 }}
  web.conf: {{ .Values.webConfig.webConf | toYaml | indent 1 }}
  resource-access.conf: {{ .Values.resourceAccessConf | toYaml | indent 1 }}
  license.conf: {{ .Values.licenseConf | toYaml | indent 1 }}
  pagination.conf: {{ .Values.paginationConf | toYaml | indent 1 }}
  events.conf: {{ .Values.eventsConf | toYaml | indent 1 }}
  network-fetch-guard.conf: {{ .Values.networkFetchGuardConf | toYaml | indent 1 }}
  {{ if .Values.devModeConf }}
  dev-mode.conf: {{ .Values.devModeConf | toYaml | indent 1 }}
  {{ end }}
  {{ if .Values.eidasAuditConf }}
  eidas-audit.conf: {{ .Values.eidasAuditConf | toYaml | indent 1 }}
  {{ end }}
  {{ if .Values.rateLimitConf }}
  rate-limit.conf: {{ .Values.rateLimitConf | toYaml | indent 1 }}
  {{ end }}
  {{ if .Values.serviceResolutionConf }}
  service-resolution.conf: {{ .Values.serviceResolutionConf | toYaml | indent 1 }}
  {{ end }}
  {{ if .Values.loggingConf }}
  klogging.json: {{ .Values.loggingConf | toYaml | indent 1 }}
  {{ end }}