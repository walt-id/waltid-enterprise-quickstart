apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-stack.fullname" . }}-api
spec:
  selector:
    matchLabels:
      app: waltid-enterprise-api
      {{- include "enterprise-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: waltid-enterprise-api
        {{- include "enterprise-stack.selectorLabels" . | nindent 8 }}
      annotations:
        latest-restart: {{ now | unixEpoch | quote }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: waltid-enterprise-api
              {{- include "enterprise-stack.selectorLabels" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: {{ .Values.api.image.pullSecrets }}
      containers:
      - name: waltid-enterprise-api
        image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.api.image.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /livez
            port: http-api
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /livez
            port: http-api
        env:
        {{- if .Values.loggingConf }}
          - name: KLOGGING_CONFIG_PATH
            value: /config/klogging.json
        {{- end }}
          - name: LICENSE_STATE_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.license.secretName }}
                key: state-encryption-key
          # Pod identity for license usage reporting. Without POD_UID the stack falls back to the
          # pod name, which Kubernetes reuses across restarts and blurs pod slot accounting.
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        {{- if .Values.license.offline }}
          - name: LICENSE_SEED_CREDENTIAL_FILE
            value: /license/offline-license.waltlicense
          - name: LICENSE_INSTALLATION_KEY_FILE
            value: /license/installation-key.json
        {{- else }}
          - name: LICENSE_SEED_CREDENTIAL
            valueFrom:
              secretKeyRef:
                name: {{ .Values.license.secretName }}
                key: seed-credential
                optional: true
        {{- end }}
        ports:
        - containerPort: 3000
          name: http-api
        volumeMounts:
        - name: waltid-enterprise-api-config
          mountPath: /config
          readOnly: true
        {{- if .Values.license.offline }}
        - name: waltid-enterprise-api-license
          mountPath: /license
          readOnly: true
        {{- end }}
      volumes:
        - name: waltid-enterprise-api-config
          configMap:
            name: {{ include "enterprise-stack.fullname" . }}-api-config
        {{- if .Values.license.offline }}
        # Default mode (0644) on purpose: the container runs as uid 10001, so a 0400 root-owned
        # projection would make the license files unreadable and fail startup closed.
        - name: waltid-enterprise-api-license
          secret:
            secretName: {{ .Values.license.secretName }}
            items:
              - key: offline-license.waltlicense
                path: offline-license.waltlicense
              - key: installation-key.json
                path: installation-key.json
        {{- end }}
