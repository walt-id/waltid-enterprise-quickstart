{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-stack.fullname" . }}-ui
spec:
  {{- if not .Values.web.hpa.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "enterprise-stack.fullname" . }}-ui
      {{- include "enterprise-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "enterprise-stack.fullname" . }}-ui
        {{- include "enterprise-stack.selectorLabels" . | nindent 8 }}
      annotations:
        latest-restart: {{ now | unixEpoch | quote }}
    spec:
      # Runs as the namespace default ServiceAccount, so an IRSA role on the API's account never reaches it.
      automountServiceAccountToken: false
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: waltid-enterprise-ui
          image: {{ include "enterprise-stack.image" (dict "image" .Values.web.image "path" "web.image" "root" .) | quote }}
          imagePullPolicy: {{ .Values.web.image.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "20m"
          env:
            - name: NUXT_PUBLIC_BASE_DOMAIN
              value: {{ .Values.ingress.host | quote }}
          ports:
            - containerPort: 3000
              name: http-api
{{- end }}
