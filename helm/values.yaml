# See helm/README.md for the Secret layout.
sensitiveConfig:
  secretName: waltid-enterprise-config
  files:
    - auth.conf
    - database.conf
    - superadmin-registration.conf

featConf: |-
  enabledFeatures = [
      admin
      superadmin-registration
  ]
# Extra enterprise.conf settings. baseDomain is generated from ingress.host above these lines;
# set it here only if the public domain differs from the ingress host (the later value wins).
enterpriseConf: ""
webConfig:
  webConf: |-
    webHost = "0.0.0.0"
    webPort = 3000
resourceAccessConf: |
  resourceAccess = {}
licenseConf: |
  licenseServerUrl = "https://license.walt.id"
  # Enterprise loads this file with lowercase config keys, so LICENSE_SEED_CREDENTIAL does not map
  # onto seedCredential by itself. These optional substitutions are what make the LICENSE_*
  # variables effective. An unset variable leaves the value untouched.
  seedCredential = ${?LICENSE_SEED_CREDENTIAL}
  seedCredentialFile = ${?LICENSE_SEED_CREDENTIAL_FILE}
  installationKeyFile = ${?LICENSE_INSTALLATION_KEY_FILE}
paginationConf: |
  {
    "defaultLimit": 100,
    "maxLimit": 1000
  }
eventsConf: |
  # How long events (POST /v1/events/query) are kept, in days. MongoDB removes older ones with a TTL index.
  # 0 keeps them forever. A change also applies to the events already stored.
  retentionDays = 90

  # Which event types are stored: IssuanceEvent, VerificationEvent, UsageEvent. Every stored event is a database write;
  # leave types out (or set []) to trade the event log for throughput. Unset stores all. Metrics still count every event.
  # storedTypes = [IssuanceEvent, VerificationEvent, UsageEvent]

  # true: issuance and verification events are written before the request goes on (nothing lost if a pod dies, a failed
  # write fails the request). false: written in the background, in batches.
  synchronous = false
networkFetchGuardConf: |
  # Server-side fetches of caller-supplied URLs follow this guard: wallet-service endpoints (issuer
  # metadata, request_uri, credential_offer_uri, token/credential endpoints, ...), Trust Registry
  # sources (sources/load with a url, sources/{sourceId}/refresh) and the trust list URLs of the
  # etsi-trust-list verification policy. By default this refuses loopback and private-network
  # (RFC1918 / IPv6 ULA) targets, in addition to link-local/cloud-metadata/multicast targets, which
  # are never allowed and have no flag here.
  #
  # Set these to true only if this deployment's services legitimately reach each other, or an internal
  # trust list publisher, on the same host or the same private network (a common topology) - otherwise
  # leave both false so private/internal infrastructure stays unreachable even from a caller-supplied URL.
  allowLoopback = false
  allowPrivateNetworks = false

  # Every organization's own hostname ({organizationId}.{baseDomain}, from enterprise.conf) is always
  # trusted regardless of the flags above, to survive split-horizon/NAT-hairpin DNS. Add further
  # hostnames (or their subdomains) here only if this deployment needs to trust something beyond its
  # own base domain - most deployments should leave this empty.
  additionalTrustedHostSuffixes = []
webhookDeliveryConf: |
  # How long a dead-lettered webhook stays in the MongoDB outbox before it is removed.
  # Pending and redriven deliveries have no failedAt field and remain eligible for delivery.
  # The single-process file outbox used with the in-memory database does not apply this retention.
  # Changing this value updates the TTL index the next time the service starts.
  deadLetterRetention = 30d
# Only read while featConf enables dev-mode, see values-demo.yaml.
devModeConf: ""
eidasAuditConf: |
  # true: every audit entry is written before the request goes on (a failed write fails the request, and nothing is
  # lost if the pod dies right after). false: entries are written in the background, in order per organization.
  synchronous = false
# Optional. With dev-mode enabled, /v1/dev/* refuses every request unless this sets an access token, which
# callers send in the X-Dev-Mode-Token header. Use a per-deployment secret: the API refuses to start with the
# placeholder from the documentation.
#   devModeAccessConf: |
#     accessToken = "<secret>"
devModeAccessConf: ""
# Optional, and only read when featConf enables debug-endpoints. Each /debug/* endpoint defaults to on only
# when the API logs at DEBUG (TRACE for heapdump and memory), so with the default logging none is served
# until it is switched on here, e.g.:
#   debugEndpointsConf: |
#     jvm = true
#     ram = true
debugEndpointsConf: ""

license:
  # Pre-provisioned Secret holding all license material. Optional key:
  #   state-encryption-key  - at least 32 characters. Encrypts the persisted license credential and
  #                           the fleet installation private key in MongoDB. Leave the key out and the
  #                           API generates its own secret, shared between replicas through MongoDB.
  #                           Supply it to keep the secret outside the database, so a database copy on
  #                           its own cannot be read. Then every replica must use the same value
  #                           (relevant with hpa.yaml enabled), it must be backed up together with
  #                           MongoDB, and live dual-key rotation is not supported.
  # Online activation (offline: false) additionally needs:
  #   seed-credential       - the openid-credential-offer:// URI from License Admin.
  # Offline/air-gapped activation (offline: true) additionally needs:
  #   offline-license.waltlicense - the bundle issued by walt.id.
  # The fleet private key is created in Mongo by the installation-request Job below. walt.id
  # does not return installation-key.json. That Secret key is only for rare pre-provision of
  # a serialized walt.id key ({"type":"jwk","jwk":{...}}).
  #
  # A PROD license refuses to start while featConf enables dev-mode (values-demo.yaml does, and
  # needs a DEV license).
  secretName: waltid-enterprise-license
  offline: false
  # Mount Secret key installation-key.json and set LICENSE_INSTALLATION_KEY_FILE. Leave false:
  # the installation-request Job already stored the fleet key in Mongo.
  provisionInstallationKeyFile: false
  # One-off bootstrap Job that creates this installation's keypair in the database and prints the
  # signed public installation request to its log. Only needed once, for offline activation, because
  # an unlicensed API never starts and so cannot be reached with kubectl exec.
  installationRequest:
    enabled: false
    licenseId: ""
    organizationId: ""
loggingConf: |
  {
    "kloggingMinLogLevel": "INFO",
    "minDirectLogLevel": "INFO",
    "sinks": {
      "stdout": {
        "renderWith": "RENDER_STANDARD",
        "sendTo": "STDOUT"
      }
    },
    "logging": [
      {
        "comment": "Root logger",
        "levelRanges": [
          {
            "fromMinLevel": "WARN",
            "toSinks": [
              "stdout"
            ]
          }
        ]
      },
      {
        "comment": "Walt.id service info",
        "matchLogger": "FeatureManager|ConfigManager|Web\\s*exception",
        "levelRanges": [
          {
            "fromMinLevel": "INFO",
            "toSinks": [
              "stdout"
            ]
          }
        ]
      },
      {
        "comment": "Default loglevel for all id.walt loggers",
        "fromLoggerBase": "id.walt",
        "levelRanges": [
          {
            "fromMinLevel": "INFO",
            "toMaxLevel": "INFO",
            "toSinks": [
              "stdout"
            ]
          }
        ]
      },
      {
        "comment": "Default loglevel for all loggers except Request/Response logger: INFO",
        "matchLogger": "^(?!(io\\.ktor\\.client|WebLog|io\\.ktor\\.server\\.plugins\\.cors)).*$",
        "levelRanges": [
          {
            "fromMinLevel": "INFO",
            "toMaxLevel": "WARN",
            "toSinks": [
              "stdout"
            ]
          }
        ]
      },
      {
        "comment": "Loglevel for service request monitoring - set it to INFO if you want enable it",
        "exactLogger": "WebLog",
        "levelRanges": [
          {
            "fromMinLevel": "WARN",
            "toSinks": [
              "stdout"
            ]
          }
        ]
      },
      {
        "comment": "Loglevel for http client requests - set it to INFO if you want enable it",
        "fromLoggerBase": "io.ktor.client",
        "levelRanges": [
          {
            "fromMinLevel": "WARN",
            "toSinks": [
              "stdout"
            ]
          }
        ]
      }
    ]
  }

api:
  # Mount a pre-provisioned Secret containing the complete /config directory instead of
  # rendering inline values into a ConfigMap. The license-request job uses the same Secret.
  # When set, sensitiveConfig is ignored: the Secret must hold every file, sensitive ones included.
  existingConfigSecret: ""
  strategy:
    type: RollingUpdate
  # Standard pod extensions, e.g. an operator configuration Secret and an existing replay PVC.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http-api
  type: ClusterIP
  # Rendered as <registry>/<repository>:<tag>. AWS Marketplace rewrites registry per region.
  image:
    registry: docker.io
    repository: waltid/waltid-enterprise-api
    # Empty uses the chart's appVersion.
    tag: ""
    # When supplied, digest takes precedence over tag for both API and bootstrap job.
    # Leave empty for AWS Marketplace, which references images by tag.
    digest: ""
    imagePullPolicy: IfNotPresent
  # Used only when hpa.enabled is false.
  replicas: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Heap as a share of the container memory limit. The JVM default is 25, which wastes most of
  # the limit and produced `Java heap space` under sustained load; 50 is the practical ceiling,
  # since the non-heap footprint measured about 0.9Gi (metaspace, threads, direct buffers).
  maxRamPercentage: 50
  resources:
    requests:
      cpu: "100m"
      memory: "2Gi"
    limits:
      memory: "6Gi"
  # The HPA targets average CPU utilization against resources.requests.cpu above, so lowering
  # that request makes the API scale out sooner for the same absolute load.
  # Needs metrics-server in the cluster (not installed on EKS by default).
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 90

# Pull Secrets for every pod, e.g. [{name: waltid-regcred}] for the private Docker Hub images.
# Not needed for AWS Marketplace ECR.
imagePullSecrets: []

# ServiceAccount for the API and the license-request Job. To reach AWS KMS or S3 without access
# keys, annotate it with an IAM role (IRSA):
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
# The UI never uses it.
serviceAccount:
  create: true
  # Empty uses the release fullname.
  name: ""
  annotations: {}

web:
  # The UI is not needed for API-only or load-test deployments.
  enabled: true
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http-api
  type: ClusterIP
  image:
    registry: docker.io
    repository: waltid/waltid-enterprise-ui
    # Empty uses the chart's appVersion.
    tag: ""
    # Same as api.image.digest. Leave empty for AWS Marketplace.
    digest: ""
    imagePullPolicy: IfNotPresent
  replicas: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 90

ingress:
  enabled: true
  # Empty uses the cluster's default IngressClass. E.g. alb (AWS Load Balancer Controller), nginx.
  ingressClassName: ""
  # Public domain of the installation. Also written to enterprise.conf as baseDomain, which the API
  # uses for every public URL; organizations are served from <organizationId>.<host>. Set it even
  # with ingress.enabled false.
  host: enterprise.example.com
  # Also route *.<host>, where organizations are served. Needs a wildcard DNS record and certificate.
  wildcardHost: true
  # Controller-specific annotations. For the AWS Load Balancer Controller, e.g.:
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account-id>:certificate/<id>
  annotations: {}
  # cert-manager ClusterIssuer. Empty adds no cert-manager annotation.
  clusterIssuer: ""
  # spec.tls entries, e.g. [{hosts: [enterprise.example.com, "*.enterprise.example.com"], secretName: enterprise-tls}].
  # The AWS Load Balancer Controller ignores this and takes the certificate from ACM.
  tls: []
  # Route /debug/* through the ingress. The endpoints exist only when featConf enables debug-endpoints.
  exposeDebugEndpoints: false