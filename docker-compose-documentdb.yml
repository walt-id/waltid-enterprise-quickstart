# walt.id Enterprise Stack on DocumentDB (the open-source PostgreSQL engine) instead of MongoDB.
# Same as docker-compose.yml, but without Caddy: the API is reached directly on ENTERPRISE_API_PORT
# (default 7500), so run the CLI with the same PORT.
#
#   docker compose -f docker-compose-documentdb.yml up
#
# Both stacks publish the API on 7500 by default; to run them together set e.g. ENTERPRISE_API_PORT=7600.

name: waltid-enterprise-documentdb

services:
  documentdb:
    # Pinned: DocumentDB is pre-GA and `latest` moves. Override with DOCUMENTDB_IMAGE.
    image: ${DOCUMENTDB_IMAGE:-ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.117.0}
    hostname: documentdb
    command:
      - --username
      - ${DOCUMENTDB_USERNAME:-docdbuser}
      - --password
      - ${DOCUMENTDB_PASSWORD:-docdbpass123}
    environment:
      # Read by the healthcheck.
      USERNAME: ${DOCUMENTDB_USERNAME:-docdbuser}
      PASSWORD: ${DOCUMENTDB_PASSWORD:-docdbpass123}
    ports:
      - "127.0.0.1:${DOCUMENTDB_PORT:-10260}:10260"
    volumes:
      - documentdb-data:/data
    networks:
      - documentdb_network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mongosh --quiet --host 127.0.0.1 --port 10260 -u \"$$USERNAME\" -p \"$$PASSWORD\" --authenticationMechanism SCRAM-SHA-256 --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  waltid-enterprise:
    image: waltid/waltid-enterprise-api:${ENTERPRISE_API_DOCKER_IMAGE_TAG}
    mem_limit: ${ENTERPRISE_MEM_LIMIT:-8g}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=${ENTERPRISE_MAX_RAM_PERCENTAGE:-70}
      - LICENSE_STATE_ENCRYPTION_KEY
      - LICENSE_SEED_CREDENTIAL
      - LICENSE_SEED_CREDENTIAL_FILE
      - LICENSE_INSTALLATION_KEY_FILE
      - LICENSE_SERVER_URL
      # Always the bundled database; docker-compose-documentdb-external.yml replaces it.
      - DOCUMENTDB_CONNECTION_STRING=mongodb://${DOCUMENTDB_USERNAME:-docdbuser}:${DOCUMENTDB_PASSWORD:-docdbpass123}@documentdb:10260/?directConnection=true&retryWrites=false
      - DOCUMENTDB_DATABASE
      # Without Caddy the listen port, the port in public URLs and the host port must be the same.
      - ENTERPRISE_WEB_PORT=${ENTERPRISE_API_PORT:-7500}
      - ENTERPRISE_BASE_PORT=${ENTERPRISE_API_PORT:-7500}
    ports:
      - "${ENTERPRISE_API_PORT:-7500}:${ENTERPRISE_API_PORT:-7500}"
    volumes:
      - ./config:/config
      - ./config/database-documentdb.conf:/config/database.conf
      - ./license:/license
    networks:
      documentdb_network:
        # The API calls its own public URLs, so these names must resolve to this container.
        aliases:
          - enterprise.localhost
          - waltid.enterprise.localhost
    depends_on:
      documentdb:
        condition: service_healthy
    command: "--log-level=error"

volumes:
  documentdb-data:
    driver: local
    name: ${DOCUMENTDB_DATA_VOLUME:-documentdb-data}

networks:
  documentdb_network:
    driver: bridge
    name: ${DOCUMENTDB_NETWORK:-documentdb-network}
