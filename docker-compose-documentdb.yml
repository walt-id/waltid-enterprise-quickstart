# walt.id Enterprise Stack quickstart backed by DocumentDB instead of MongoDB.
#
# DocumentDB (the open-source PostgreSQL engine, not AWS's proprietary service) speaks the MongoDB
# wire protocol, so the Enterprise API needs only a different database.conf. This file is otherwise
# a copy of docker-compose.yml with the database service swapped and the profile/connection handled
# in config-documentdb/database.conf. It has no Caddy: the API is reached directly on port 7500 and
# carries the enterprise.localhost aliases itself, which config-documentdb/enterprise.conf matches
# with basePort = 7500. Run the CLI against it with PORT=7500.
#
# Run it with:
#
#   docker compose -f docker-compose-documentdb.yml up
#
# A separate project name keeps it isolated from the MongoDB stack, so both can exist on one host;
# they must not publish the same host ports at the same time, so stop one before starting the other
# or override the *_PORT variables.
#
# First activation needs a license seed exactly as the MongoDB quickstart does (see the README):
# either LICENSE_SEED_CREDENTIAL with an online offer, or a .waltlicense bundle plus an installation
# key that already exists in this database. The bound credential and installation key are persisted
# in DocumentDB, so later restarts reuse them. Switching an existing MongoDB installation to
# DocumentDB means transferring that state - see migrate-license-state-to-documentdb.sh.

name: waltid-enterprise-documentdb

services:
  documentdb:
    image: ${DOCUMENTDB_IMAGE:-ghcr.io/documentdb/documentdb/documentdb-local:latest}
    hostname: documentdb
    # Plaintext is the container default (TLS_MODE=allowTLS) and is what config-documentdb uses, so
    # no certificate material is needed for the quickstart. Add `--tlsMode requireTLS` here and the
    # `ssl` block in config-documentdb/database.conf to serve over TLS instead.
    command:
      - --username
      - ${DOCUMENTDB_USERNAME:-docdbuser}
      - --password
      - ${DOCUMENTDB_PASSWORD:-docdbpass123}
    environment:
      # Also declared as environment (not only as command flags) so the healthcheck below can read
      # them; variables exported by the entrypoint are not visible to a later exec.
      USERNAME: ${DOCUMENTDB_USERNAME:-docdbuser}
      PASSWORD: ${DOCUMENTDB_PASSWORD:-docdbpass123}
    ports:
      # Loopback-only by default: DocumentDB has no user-facing UI and should not be exposed.
      - "127.0.0.1:${DOCUMENTDB_PORT:-10260}:10260"
    volumes:
      - documentdb-data:/data
    networks:
      - documentdb_network
    healthcheck:
      # `docker ps` reports Up well before the gateway accepts connections, and the first client to
      # connect too early fails. An authenticated ping is the only signal that the endpoint is
      # actually usable, so the API is gated on this rather than on the container having started.
      test:
        - "CMD-SHELL"
        - "mongosh --quiet --host 127.0.0.1 --port 10260 -u \"$$USERNAME\" -p \"$$PASSWORD\" --authenticationMechanism SCRAM-SHA-256 --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  waltid-enterprise:
    image: waltid/waltid-enterprise-api:${ENTERPRISE_API_DOCKER_IMAGE_TAG}
    # Pass-through form: a variable that is not defined anywhere is omitted from the container, so the
    # optional HOCON substitutions in config/license.conf leave the configured values untouched.
    # LICENSE_STATE_ENCRYPTION_KEY is the exception, because .env declares it empty, so it arrives as
    # an empty string. The API treats a blank value as unset and generates its own secret.
    # Bounded, with the heap percentage raised to match, for the same reason as the MongoDB
    # quickstart: an unbounded JVM sizes its heap from host RAM.
    mem_limit: ${ENTERPRISE_MEM_LIMIT:-8g}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=${ENTERPRISE_MAX_RAM_PERCENTAGE:-70}
      - LICENSE_STATE_ENCRYPTION_KEY
      - LICENSE_SEED_CREDENTIAL
      - LICENSE_SEED_CREDENTIAL_FILE
      - LICENSE_INSTALLATION_KEY_FILE
      # Points the stack at a different license server, for example a walt.id test environment.
      # Unset leaves the licenseServerUrl configured in config/license.conf untouched.
      - LICENSE_SERVER_URL
      # Optional database overrides read by config-documentdb/database.conf. Leave unset to use the
      # local documentdb service and the default database name.
      - DOCUMENTDB_CONNECTION_STRING
      - DOCUMENTDB_DATABASE
      # TLS towards a gateway that enforces it (see docker-compose-documentdb-external.yml).
      - DOCUMENTDB_SSL_ENABLE
      - DOCUMENTDB_TRUSTSTORE_LOCATION
      - DOCUMENTDB_TRUSTSTORE_PASSWORD
      - DOCUMENTDB_INVALID_HOSTNAME_ALLOWED
      # - LOG_LEVEL=trace
    ports:
      - "${ENTERPRISE_API_PORT:-7500}:7500"
    volumes:
      - ./config:/config
      # Only database.conf and enterprise.conf are replaced; every other config file is shared with
      # the MongoDB stack. A later bind mount onto a file wins over the directory mount before it.
      - ./config-documentdb/database.conf:/config/database.conf
      - ./config-documentdb/enterprise.conf:/config/enterprise.conf
      # Offline/air-gapped activation: hold the .waltlicense here, plus the public
      # installation-request.json from `license request`. The fleet private key stays in
      # DocumentDB; do not expect walt.id to return installation-key.json.
      - ./license:/license
    networks:
      documentdb_network:
        # No reverse proxy in this stack, so the API owns its public hostnames. It calls its own
        # public URLs (e.g. to fetch a credential offer), which must resolve to this container.
        aliases:
          - enterprise.localhost
          - waltid.enterprise.localhost
          # add your own organisation domains here
    depends_on:
      documentdb:
        condition: service_healthy
    command: "--log-level=error"

volumes:
  documentdb-data:
    driver: local
    name: ${DOCUMENTDB_DATA_VOLUME:-documentdb-data}

networks:
  documentdb_network:
    driver: bridge
    name: ${DOCUMENTDB_NETWORK:-documentdb-network}
