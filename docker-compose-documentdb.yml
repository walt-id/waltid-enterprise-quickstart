# walt.id Enterprise Stack quickstart backed by DocumentDB instead of MongoDB.
#
# DocumentDB (the open-source PostgreSQL engine, not AWS's proprietary service) speaks the MongoDB
# wire protocol, so this is docker-compose.yml with the database service swapped and a different
# database.conf (config/database-documentdb.conf). There is no Caddy: the API is reached directly on
# ENTERPRISE_API_PORT (default 7500) and carries the enterprise.localhost aliases itself. Run the CLI
# with PORT set to the same value.
#
#   docker compose -f docker-compose-documentdb.yml up
#
# It has its own project, network and volume. Both stacks publish the API on 7500 by default, so to
# run them at the same time start this one with another port (ENTERPRISE_API_PORT=7600, then
# PORT=7600 for the CLI).
#
# A fresh database needs a license seed as in the MongoDB quickstart (see the README). The bound
# license is persisted in DocumentDB, so restarts reuse it. A license binds to one installation at
# a time, so activating it here invalidates the MongoDB installation it came from.

name: waltid-enterprise-documentdb

services:
  documentdb:
    # Pinned: DocumentDB is pre-GA and `latest` moves. Override with DOCUMENTDB_IMAGE.
    image: ${DOCUMENTDB_IMAGE:-ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.117.0}
    hostname: documentdb
    # Plaintext is the container default (TLS_MODE=allowTLS) and is what config/database-documentdb.conf
    # uses, so no certificate material is needed for the quickstart. Add `--tlsMode requireTLS` here and
    # the `ssl` block in config/database-documentdb.conf to serve over TLS instead.
    command:
      - --username
      - ${DOCUMENTDB_USERNAME:-docdbuser}
      - --password
      - ${DOCUMENTDB_PASSWORD:-docdbpass123}
    environment:
      # Also declared as environment (not only as command flags) so the healthcheck below can read
      # them; variables exported by the entrypoint are not visible to a later exec.
      USERNAME: ${DOCUMENTDB_USERNAME:-docdbuser}
      PASSWORD: ${DOCUMENTDB_PASSWORD:-docdbpass123}
    ports:
      # Loopback-only by default: DocumentDB has no user-facing UI and should not be exposed.
      - "127.0.0.1:${DOCUMENTDB_PORT:-10260}:10260"
    volumes:
      - documentdb-data:/data
    networks:
      - documentdb_network
    healthcheck:
      # `docker ps` reports Up well before the gateway accepts connections, and the first client to
      # connect too early fails. An authenticated ping is the only signal that the endpoint is
      # actually usable, so the API is gated on this rather than on the container having started.
      test:
        - "CMD-SHELL"
        - "mongosh --quiet --host 127.0.0.1 --port 10260 -u \"$$USERNAME\" -p \"$$PASSWORD\" --authenticationMechanism SCRAM-SHA-256 --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  waltid-enterprise:
    image: waltid/waltid-enterprise-api:${ENTERPRISE_API_DOCKER_IMAGE_TAG}
    # Pass-through form: a variable that is not defined anywhere is omitted from the container, so the
    # optional HOCON substitutions in config/license.conf leave the configured values untouched.
    # LICENSE_STATE_ENCRYPTION_KEY is the exception, because .env declares it empty, so it arrives as
    # an empty string. The API treats a blank value as unset and generates its own secret.
    # Bounded, with the heap percentage raised to match, for the same reason as the MongoDB
    # quickstart: an unbounded JVM sizes its heap from host RAM.
    mem_limit: ${ENTERPRISE_MEM_LIMIT:-8g}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=${ENTERPRISE_MAX_RAM_PERCENTAGE:-70}
      - LICENSE_STATE_ENCRYPTION_KEY
      - LICENSE_SEED_CREDENTIAL
      - LICENSE_SEED_CREDENTIAL_FILE
      - LICENSE_INSTALLATION_KEY_FILE
      # Points the stack at a different license server, for example a walt.id test environment.
      # Unset leaves the licenseServerUrl configured in config/license.conf untouched.
      - LICENSE_SERVER_URL
      # Read by config/database-documentdb.conf. The connection string is always built from the
      # documentdb service's login above (URL-encode special characters) and never taken from the
      # environment, so one meant for a gateway you operate yourself cannot reach this stack's
      # database by accident. docker-compose-documentdb-external.yml sets it, and the TLS settings,
      # for that case.
      - DOCUMENTDB_CONNECTION_STRING=mongodb://${DOCUMENTDB_USERNAME:-docdbuser}:${DOCUMENTDB_PASSWORD:-docdbpass123}@documentdb:10260/?directConnection=true&retryWrites=false
      - DOCUMENTDB_DATABASE
      # No Caddy, so the port the API listens on, the port in its public URLs and the host port must
      # be the same: the API calls its own public URLs both from inside this container (through the
      # aliases below) and hands them to clients on the host. Read by config/web.conf and
      # config/enterprise.conf.
      - ENTERPRISE_WEB_PORT=${ENTERPRISE_API_PORT:-7500}
      - ENTERPRISE_BASE_PORT=${ENTERPRISE_API_PORT:-7500}
      # - LOG_LEVEL=trace
    ports:
      - "${ENTERPRISE_API_PORT:-7500}:${ENTERPRISE_API_PORT:-7500}"
    volumes:
      - ./config:/config
      # Only database.conf is replaced; every other config file is shared with the MongoDB stack.
      # A later bind mount onto a file wins over the directory mount before it.
      - ./config/database-documentdb.conf:/config/database.conf
      # Offline/air-gapped activation: hold the .waltlicense here, plus the public
      # installation-request.json from `license request`. The fleet private key stays in
      # DocumentDB; do not expect walt.id to return installation-key.json.
      - ./license:/license
    networks:
      documentdb_network:
        # No reverse proxy in this stack, so the API owns its public hostnames. It calls its own
        # public URLs (e.g. to fetch a credential offer), which must resolve to this container.
        aliases:
          - enterprise.localhost
          - waltid.enterprise.localhost
          # add your own organisation domains here
    depends_on:
      documentdb:
        condition: service_healthy
    command: "--log-level=error"

volumes:
  documentdb-data:
    driver: local
    name: ${DOCUMENTDB_DATA_VOLUME:-documentdb-data}

networks:
  documentdb_network:
    driver: bridge
    name: ${DOCUMENTDB_NETWORK:-documentdb-network}
