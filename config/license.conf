# Enterprise license configuration

# First startup requires exactly one of the seed options below. After successful activation,
# Enterprise stores the bound credential and installation key in MongoDB. Later restarts use that
# persisted state, so an online credential offer is never redeemed twice.
#

# URL used for online activation, heartbeat renewal, and usage reporting.
licenseServerUrl = "https://license.walt.id"

# Enterprise internally bounds startup refresh attempts and heartbeat/report cadence. These are
# vendor policy, not customer-editable license options. Temporary license-server outages do not
# prevent startup while a cached credential remains ACTIVE or within its signed grace behavior.

# LICENSE_STATE_ENCRYPTION_KEY encrypts the persisted credential and fleet installation private key.
# It is optional. When unset, a random secret is generated on first start and shared between replicas
# through MongoDB, wrapped with a key compiled into the image. Setting it keeps the secret outside the
# database, so a database copy on its own cannot be read.
#
# When set: use the same value across every replica, back it up with MongoDB, and supply it from a
# secret manager. Docker Compose injects it from .env; Kubernetes deployments should use Secret
# waltid-enterprise-license / state-encryption-key. A wrong value fails startup closed, and changing it
# without first re-encrypting rawVc and installationKeyJwk makes existing state unreadable. Live
# dual-key rotation is not supported.
#
# Usage reports are contractual self-reporting. Their signatures authenticate the installation and
# report contents but do not make customer-controlled local metering an independent audit source.

# Online first activation
#
# Create an online license in License Admin, copy the returned offer, and uncomment this line.
# seedCredential = "openid-credential-offer://..."

# Raw credential seed
#
# Intended for controlled migrations or recovery when a signed raw SD-JWT VC is already available.
# Do not configure this together with seedCredentialFile.
# seedCredential = "eyJ..."

# Offline or air-gapped activation
#
# Mount the .waltlicense bundle and its matching private installation key, then uncomment both lines.
# Keep installation-key.json inside the customer environment; never send it to the license server.
# seedCredentialFile = "/license/offline-license.waltlicense"
# installationKeyFile = "/license/installation-key.json"

# Environment overrides
#
# Enterprise loads this file with lowercase config keys, so an environment variable named
# LICENSE_SEED_CREDENTIAL does not map onto seedCredential by itself. The optional substitutions
# below are what make the LICENSE_* variables effective. They must stay last in this file: an unset
# variable leaves any value configured above untouched, while a set variable overrides it.
#
# Docker Compose passes these through from the shell or .env; Kubernetes should source them from
# Secret waltid-enterprise-license.
seedCredential = ${?LICENSE_SEED_CREDENTIAL}
seedCredentialFile = ${?LICENSE_SEED_CREDENTIAL_FILE}
installationKeyFile = ${?LICENSE_INSTALLATION_KEY_FILE}
