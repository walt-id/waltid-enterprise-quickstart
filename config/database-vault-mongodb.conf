# External native MongoDB. docker-compose-vault.yml mounts this file as /config/database.conf.
databaseType = mongodb
mongodb {
    connectionString = ${VAULT_DATABASE_CONNECTION_STRING}
    database = ${VAULT_DATABASE_NAME}
    profile = MONGODB_8

    vault {
        address = ${VAULT_ADDRESS}
        databaseMount = ${VAULT_DATABASE_MOUNT}
        role = ${VAULT_DATABASE_ROLE}
        roleType = ${VAULT_DATABASE_ROLE_TYPE}
        authSource = ${VAULT_MONGODB_AUTH_SOURCE}
        tokenFile = "/run/vault-token/token"
        namespace = ${?VAULT_NAMESPACE}
        staticPollIntervalSeconds = 5
        requestTimeoutSeconds = 5
        validationTimeoutSeconds = 10
        startupTimeoutSeconds = 60
        retryMaxDelaySeconds = 10
        refreshSafetyMarginSeconds = 5
        maxDrainSeconds = 30

        # Optional private Vault CA and mutual TLS. Passwords are read from mounted files.
        # tls {
        #     trustStoreFile = "/run/vault-tls/vault-trust.p12"
        #     trustStorePasswordFile = "/run/vault-tls/vault-trust-password"
        #     keyStoreFile = "/run/vault-tls/vault-client.p12"
        #     keyStorePasswordFile = "/run/vault-tls/vault-client-password"
        # }
    }
}
