enabledFeatures = [
    admin // adds routes for administration of globals
    dev-mode // adds routes useful for development
    superadmin-registration // allows registering superadmins
    external-authorization-server-for-issuer
    # telemetry
    vical
    x509
    client-attester
    wallet-provider // wallet instance and key attestations; used by the CLI SCA/PID and wallet provider trust flows
    trust-registry
    oidc-bridge // used by the CLI --setup-create-oidc-bridge flow
    # eidas-audit // durable eIDAS hash-chain audit log; enable when compliance evidence is required
    # proximity-verifier // Verifier2 endpoint for decrypted mdoc responses from an external reader
    # import-export // export and import organizations or tenants under maintenance
    # organization-ownership // let one organization offer ownership to another

    # ebsi-v3.2-verifier-conformance-test // EBSI v3.2 CT endpoints
    # prometheus // Prometheus metrics
]

disabledFeatures = [
    # debug-endpoints
    # account-registration
    # external-authorization-server-for-issuer
]
