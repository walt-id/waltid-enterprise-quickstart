# Local-only token so the quickstart CLI can call /v1/dev/* while dev-mode is enabled above.
# Anyone with this repo already has it, so it provides no protection by itself; do not reuse it,
# or expose this stack off localhost with dev-mode still enabled and this token still set.
accessToken = "replace-with-a-per-deployment-secret"

# Password for the optional /v1/dev/add-example-data account. Set this before seeding.
exampleAccountPassword = ${?WALTID_DEV_EXAMPLE_PASSWORD}
