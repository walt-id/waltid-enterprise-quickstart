# Unified rate-limit configuration for OpenID4VCI (issuer2) and OpenID4VP (verifier2).
#
# Basic request-volume limits are always applied by Ktor per service target,
# endpoint, and source IP as observed by the ES runtime.
#
# Progressive failure backoff is applied only when Redis is configured in the
# persistence section below. It is shared across ES instances using the same
# Redis deployment.

# Persistence configuration for progressive failure backoff.
# Without Redis, only Ktor's basic request-volume limits apply.
persistence {
  # Default: no Redis, failure backoff disabled
  # type = "memory"

  # Redis single-node example:
  # type = "redis"
  # nodes = [{ host = "redis", port = 6379 }]
  # user = "default"
  # password = "change-me"

  # Redis cluster example:
  # type = "redis-cluster"
  # nodes = [
  #   { host = "redis-node-1", port = 6379 },
  #   { host = "redis-node-2", port = 6379 },
  #   { host = "redis-node-3", port = 6379 }
  # ]
}

# Issuer2 OpenID4VCI rate limits
issuer2_token_endpoint {
  requestsPerMinute = 5
  failureWindowSeconds = 60
  failureThreshold = 5
  failureBlockSeconds = 300
}

issuer2_credential_endpoint {
  requestsPerMinute = 10
  failureWindowSeconds = 60
  failureThreshold = 5
  failureBlockSeconds = 300
}

# Verifier2 OpenID4VP rate limits
verifier2_request_endpoint {
  requestsPerMinute = 40
  failureWindowSeconds = 60
  failureThreshold = 5
  failureBlockSeconds = 300
}

verifier2_response_endpoint {
  requestsPerMinute = 20
  failureWindowSeconds = 60
  failureThreshold = 5
  failureBlockSeconds = 300
}
