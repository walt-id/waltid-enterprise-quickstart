# Database configuration for the open-source DocumentDB (PostgreSQL engine) backend.
#
# The API only reads config/database.conf; docker-compose-documentdb.yml bind-mounts this file onto
# it, so everything else under ./config is shared with the MongoDB quickstart.
#
# DocumentDB speaks the MongoDB wire protocol, but:
#   1. The profile must be DOCUMENTDB_POSTGRES. AWS_DOCUMENTDB_* is a different product and gives up
#      cursor-in-transaction needlessly, while MONGODB_* would claim collation support this engine
#      lacks and rejects on most commands.
#   2. `retryWrites=false` is mandatory; the engine has no retryable writes.
#   3. `collation = "none"`: collation is not supported on find, index and update here.
#   4. TLS settings come only from the `ssl` block, because the Java driver ignores `tlsInsecure`; a
#      self-signed gateway certificate therefore needs a JKS trust store. The bundled documentdb-local
#      also accepts plaintext (TLS_MODE=allowTLS), which is what the defaults below use. A gateway on
#      your own PostgreSQL enforces TLS, see docs/documentdb-existing-postgres.md. Keep exactly ONE
#      `ssl` block: a second one silently overrides this one.

databaseType = mongodb

mongodb = {
    # Both compose files set DOCUMENTDB_CONNECTION_STRING; this default only matters outside them.
    connectionString = "mongodb://docdbuser:docdbpass123@documentdb:10260/?directConnection=true&retryWrites=false"
    connectionString = ${?DOCUMENTDB_CONNECTION_STRING}

    database = "waltid-enterprise"
    database = ${?DOCUMENTDB_DATABASE}

    profile = DOCUMENTDB_POSTGRES

    collation = "none"

    pool = {
        maxSize = 100
        minSize = 10
        maxWaitTimeMs = 5000
        maxConnectionIdleTimeMs = 60000
        maxConnectionLifeTimeMs = 1800000
    }

    # Plaintext by default; docker-compose-documentdb-external.yml sets the DOCUMENTDB_* variables for
    # TLS. Never set the booleans to an empty string: `${?VAR}` then replaces the default with "" and
    # the API fails to start because the value is not a boolean.
    ssl = {
        enable = false
        enable = ${?DOCUMENTDB_SSL_ENABLE}
        trustStoreLocation = ""
        trustStoreLocation = ${?DOCUMENTDB_TRUSTSTORE_LOCATION}
        trustStorePassword = ""
        trustStorePassword = ${?DOCUMENTDB_TRUSTSTORE_PASSWORD}
        invalidHostNameAllowed = false
        invalidHostNameAllowed = ${?DOCUMENTDB_INVALID_HOSTNAME_ALLOWED}
        keyStoreLocation = ""
        keyStorePassword = ""
        keyPassword = ""
    }
}
