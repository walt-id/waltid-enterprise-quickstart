# How long the MongoDB and PostgreSQL outboxes retain dead-lettered webhooks.
# Pending and redriven deliveries have no failedAt field and remain eligible for delivery.
# The single-process file outbox used with the in-memory database does not apply this retention.
# MongoDB updates its TTL index at startup. PostgreSQL removes expired rows when claiming
# deliveries, listing dead letters or retrying a dead letter.
deadLetterRetention = 30d
