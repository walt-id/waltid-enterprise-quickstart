# Server-side fetches of caller-supplied URLs follow this guard: wallet-service endpoints (issuer
# metadata, request_uri, credential_offer_uri, token/credential endpoints, ...), Trust Registry
# sources (sources/load with a url, sources/{sourceId}/refresh) and the trust list URLs of the
# etsi-trust-list verification policy. By default this refuses loopback and private-network
# (RFC1918 / IPv6 ULA) targets, in addition to link-local/cloud-metadata/multicast targets, which
# are never allowed and have no flag here.
#
# Set these to true only if this deployment's services legitimately reach each other, or an internal
# trust list publisher, on the same host or the same private network (a common topology) - otherwise
# leave both false so private/internal infrastructure stays unreachable even from a caller-supplied URL.
allowLoopback = false
allowPrivateNetworks = false

# Every organization's own hostname ({organizationId}.{baseDomain}, from enterprise.conf) is always
# trusted regardless of the flags above, to survive split-horizon/NAT-hairpin DNS. Add further
# hostnames (or their subdomains) here only if this deployment needs to trust something beyond its
# own base domain - most deployments should leave this empty.
additionalTrustedHostSuffixes = []
