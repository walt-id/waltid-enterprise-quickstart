# Wallet-service endpoints fetch caller-supplied URLs server-side (issuer metadata, request_uri,
# credential_offer_uri, token/credential endpoints, ...). By default this refuses loopback and
# private-network (RFC1918 / IPv6 ULA) targets, in addition to link-local/cloud-metadata/multicast
# targets, which are never allowed and have no flag here.
#
# Set these to true only if this deployment's issuer/verifier/wallet services legitimately run as
# siblings on the same host or the same private network (a common topology) - otherwise leave both
# false so private/internal infrastructure stays unreachable even from a caller-supplied URL.
allowLoopback = false
allowPrivateNetworks = false

# Every organization's own hostname ({organizationId}.{baseDomain}, from enterprise.conf) is always
# trusted regardless of the flags above, to survive split-horizon/NAT-hairpin DNS. Add further
# hostnames (or their subdomains) here only if this deployment needs to trust something beyond its
# own base domain - most deployments should leave this empty.
additionalTrustedHostSuffixes = []
