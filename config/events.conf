# How long events (POST /v1/events/query) are kept, in days. MongoDB removes older ones with a TTL index.
# 0 keeps them forever. A change also applies to the events already stored.
retentionDays = 90

# Which event types are stored: IssuanceEvent, VerificationEvent, UsageEvent. Every stored event is a database write;
# leave types out (or set []) to trade the event log for throughput. Unset stores all. Metrics still count every event.
# storedTypes = [IssuanceEvent, VerificationEvent, UsageEvent]

# true: issuance and verification events are written before the request goes on (nothing lost if a pod dies, a failed
# write fails the request). false: written in the background, in batches.
synchronous = false
