# walt.id Enterprise Service
# Base configuration

# Base domain of this service, e.g. `waltid.cloud`
baseDomain = "enterprise.localhost"
baseSsl = false
# Port used in generated public URLs. Caddy owns enterprise.localhost on port 80 and proxies
# /v1, /v2, /auth, /.well-known to waltid-enterprise:7500, so callbacks the API makes to itself
# go through Caddy too. Use 7500 only when running the API without Caddy in front of it.
basePort = 80
