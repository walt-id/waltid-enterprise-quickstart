# Database configuration for the vanilla PostgreSQL backend.
#
# The API only reads config/database.conf; docker-compose-postgresql.yml bind-mounts this file onto
# it, so everything else under ./config is shared with the MongoDB quickstart.
#
# This is not DocumentDB and it does not speak the MongoDB wire protocol. There is no migration from
# an existing MongoDB database. Licensing needs usageCheckpointEngine = true (config/license.conf);
# the reservation engine is refused on this database. Settings are described in
# https://docs.walt.id/enterprise-stack/setup/configurations/config-files/database

databaseType = postgresql

postgresql {
    # docker-compose-postgresql.yml sets all three; these defaults only matter outside it.
    # Put the database name in the URL, and the login in the fields below rather than in the URL.
    # currentSchema on the URL selects the schema when postgresql.schema stays at its default, public.
    # Set schema = "walt_id_owner" here to override the URL.
    connectionString = "jdbc:postgresql://postgres:5432/waltid_enterprise"
    connectionString = ${?POSTGRES_CONNECTION_STRING}

    username = "waltid"
    username = ${?POSTGRES_USERNAME}

    password = "waltid"
    password = ${?POSTGRES_PASSWORD}

    # true deletes application and license data on every start, and is refused unless dev-mode is on.
    recreateOnStart = false

    # A request can hold two connections: keep maxSize times replicas times two under max_connections.
    pool {
        maxSize = 24
        minIdle = 4
    }

    ssl {
        enable = false
    }
}
