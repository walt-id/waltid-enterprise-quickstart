# walt.id Enterprise Service
# Base configuration for the DocumentDB stack.
#
# This file is mounted over config/enterprise.conf by docker-compose-documentdb.yml. The only
# difference from the MongoDB quickstart is the port: that stack has Caddy in front of the API on
# port 80, this one has no reverse proxy and the API is reached directly on 7500.

# Base domain of this service, e.g. `waltid.cloud`
baseDomain = "enterprise.localhost"
baseSsl = false
# Port used in generated public URLs. The API calls its own public URLs (for example to fetch a
# credential offer), and docker-compose-documentdb.yml gives the API container the
# enterprise.localhost aliases, so those calls reach the API itself on its container port. Keep this
# equal to the port the API listens on (7500), not to a remapped ENTERPRISE_API_PORT host port.
basePort = 7500
