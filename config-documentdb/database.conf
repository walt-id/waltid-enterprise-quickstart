# Database configuration for the open-source DocumentDB (PostgreSQL engine) backend.
#
# This file is mounted over config/database.conf by docker-compose-documentdb.yml. Everything
# else under ./config is shared with the MongoDB quickstart, so the two stacks differ only here
# (and in the port, which docker-compose-documentdb.yml sets because this stack has no Caddy).
#
# DocumentDB speaks the MongoDB wire protocol, but four things are not MongoDB:
#   1. The profile must be DOCUMENTDB_POSTGRES. The AWS_DOCUMENTDB_* profiles are a different
#      product (AWS's proprietary service) and give up cursor-in-transaction needlessly, while a
#      MONGODB_* profile would claim collation is supported, which this engine rejects on most
#      commands.
#   2. `retryWrites=false` is mandatory; the engine has no retryable writes.
#   3. `collation = "none"` - collation is not supported on find/index/update here.
#   4. TLS. The documentdb-local gateway serves a self-signed certificate and defaults to
#      TLS_MODE=allowTLS, i.e. it also accepts plaintext, which is what this file uses. The Java
#      driver ignores `tlsInsecure` in the connection string and only reads TLS settings from the
#      `ssl` block below, so a self-signed certificate needs a JKS trust store. To enable TLS:
#        - start the service with `--tlsMode requireTLS`,
#        - set `tls=true` in the connection string,
#        - set ssl.enable = true and ssl.trustStoreLocation to the JKS holding the gateway
#          certificate (and ssl.invalidHostNameAllowed = true when the certificate's name does
#          not match the host you dial). The `ssl` block below reads these from the
#          DOCUMENTDB_SSL_ENABLE, DOCUMENTDB_TRUSTSTORE_LOCATION, DOCUMENTDB_TRUSTSTORE_PASSWORD
#          and DOCUMENTDB_INVALID_HOSTNAME_ALLOWED environment variables, which
#          docker-compose-documentdb-external.yml sets. If you set them yourself, never set the
#          booleans to an empty string: `${?VAR}` then replaces the default with "" and the API
#          fails to start because the value is not a boolean.
#      There must be exactly ONE `ssl` block in the merged configuration; a second one silently
#      overrides this one.

databaseType = mongodb

mongodb = {
    connectionString = "mongodb://docdbuser:docdbpass123@documentdb:10260/?directConnection=true&retryWrites=false"
    # Optional overrides (unset leaves the value above untouched). Useful for a managed endpoint
    # such as Azure Cosmos DB for MongoDB vCore, or to keep a database name that already exists.
    connectionString = ${?DOCUMENTDB_CONNECTION_STRING}

    database = "waltid-enterprise"
    database = ${?DOCUMENTDB_DATABASE}

    profile = DOCUMENTDB_POSTGRES

    collation = "none"

    pool = {
        maxSize = 100
        minSize = 10
        maxWaitTimeMs = 5000
        maxConnectionIdleTimeMs = 60000
        maxConnectionLifeTimeMs = 1800000
    }

    # TLS towards the gateway. The defaults are plaintext for the bundled documentdb-local service;
    # a gateway on your own PostgreSQL always enforces TLS, see docs/documentdb-existing-postgres.md.
    # The DOCUMENTDB_* overrides keep this a single `ssl` block (a second one would replace it).
    ssl = {
        enable = false
        enable = ${?DOCUMENTDB_SSL_ENABLE}
        trustStoreLocation = ""
        trustStoreLocation = ${?DOCUMENTDB_TRUSTSTORE_LOCATION}
        trustStorePassword = ""
        trustStorePassword = ${?DOCUMENTDB_TRUSTSTORE_PASSWORD}
        invalidHostNameAllowed = false
        invalidHostNameAllowed = ${?DOCUMENTDB_INVALID_HOSTNAME_ALLOWED}
        keyStoreLocation = ""
        keyStorePassword = ""
        keyPassword = ""
    }
}
